<svg xmlns="http://www.w3.org/2000/svg" width="630" height="880" viewBox="0 0 630 880">
  <defs>
    <linearGradient id="edgeSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- The template owns only decorative/structural geometry. Generated rails,
       description panels, text, and stats stay in the shared renderers. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10.5" y="10.5" width="609" height="859" rx="29"
          stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3"/>
    <rect x="21" y="21" width="588" height="838" rx="23"
          stroke="url(#edgeSheen)" stroke-width="1.5"/>

    <!-- restrained header shoulders -->
    <path d="M44 106V78Q44 64 58 64H112"
          stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
    <path d="M586 106V78Q586 64 572 64H518"
          stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>

    <!-- artwork bezel -->
    <rect x="34" y="112" width="562" height="346" rx="16"
          stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="2"/>
    <rect x="39" y="117" width="552" height="336" rx="12"
          stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>

    <!-- compact lower structure -->
    <path d="M52 520H578" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
    <path d="M52 778H578" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>

    <!-- subtle corner ticks keep the family distinct without clutter -->
    <path d="M36 152v-18q0-10 10-10h18 M594 152v-18q0-10-10-10h-18"
          stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>
    <path d="M36 816v18q0 10 10 10h18 M594 816v18q0 10-10 10h-18"
          stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  </g>

  <g fill="#FFFFFF" fill-opacity="0.10">
    <circle cx="36" cy="36" r="3.5"/>
    <circle cx="594" cy="36" r="3.5"/>
    <circle cx="36" cy="844" r="3.5"/>
    <circle cx="594" cy="844" r="3.5"/>
  </g>
</svg>
