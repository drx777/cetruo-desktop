name: Apply 0.14.4 integration

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply-0144.py'
      - 'scripts/fix-0144-integration.py'
      - '.github/workflows/apply-0144.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[0144-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply integration
        run: |
          python3 scripts/apply-0144.py
          python3 scripts/fix-0144-integration.py
      - name: Compile
        run: ./gradlew compileKotlin
      - name: Commit integrated sources
        run: |
          git config user.name 'Card Forge Integration'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main/kotlin/com/example/cardforge/Main.kt src/main/kotlin/com/example/cardforge/CardRenderer.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Complete 0.14.4 feature integration [0144-integrated]'
          git push
